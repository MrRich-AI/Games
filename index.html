<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Rich's IGCSE ESL Games</title>
<style>
  :root{
    --bg-top:#080a1e;
    --bg-mid:#241454;
    --bg-low:#7a2f6b;
    --bg-glow:#ff8a4c;
    --card:#1b1f27cc;
    --card-hover:#242a35e6;
    --text:#f5f7fa;
    --sub:#a9b1c0;
    --accent:#4f8dfd;
    --accent2:#33d69f;
    --border:#2c3240;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--text);
    min-height:100%;
    background:
      radial-gradient(ellipse at 50% 100%, var(--bg-glow) 0%, transparent 55%),
      linear-gradient(180deg,
        var(--bg-top) 0%,
        #1b1454 22%,
        var(--bg-mid) 40%,
        var(--bg-low) 60%,
        #c1495a 78%,
        var(--bg-glow) 100%);
    background-attachment: fixed, fixed;
    overflow-x:hidden;
  }

  /* fireworks canvas sits fixed behind all content */
  #fireworks{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:0;
    pointer-events:none;
    display:block;
  }

  .page{
    position:relative;
    z-index:1;
    padding:24px 16px 48px;
    max-width:520px;
    margin:0 auto;
  }

  header{
    text-align:center;
    margin-bottom:28px;
  }
  header h1{
    font-size:1.5rem;
    margin:0 0 6px;
    text-shadow:0 2px 10px rgba(0,0,0,.55);
  }
  header p{
    color:var(--sub);
    margin:0;
    font-size:0.95rem;
    text-shadow:0 1px 6px rgba(0,0,0,.5);
  }

  .logo-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:4px;
  }
  #logoCanvas{
    display:block;
    width:100%;
    max-width:220px;
    height:auto;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));
  }

  .grid{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .backbtn{
    display:inline-block;
    align-self:flex-start;
    font:inherit;
    font-size:.95rem;
    font-weight:700;
    color:var(--text);
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:8px 14px;
    text-decoration:none;
    backdrop-filter: blur(6px);
  }
  .backbtn:hover{ background:var(--card-hover); border-color:var(--accent); }
  a.card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    text-decoration:none;
    color:var(--text);
    backdrop-filter: blur(6px);
    transition:background 0.15s ease, transform 0.1s ease;
  }
  a.card:active{
    transform:scale(0.98);
  }
  a.card:hover{
    background:var(--card-hover);
    border-color:var(--accent);
  }
  .icon{
    flex:0 0 auto;
    width:42px;
    height:42px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
  }
  .icon svg{
    width:22px;
    height:22px;
    stroke:#0f1115;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .label{
    flex:1 1 auto;
    min-width:0;
  }
  .label .name{
    font-weight:600;
    font-size:1rem;
    line-height:1.25;
  }
  .label .sub{
    color:var(--sub);
    font-size:0.8rem;
    margin-top:2px;
  }
  .arrow{
    flex:0 0 auto;
    color:var(--sub);
    font-size:1.2rem;
  }
  footer{
    text-align:center;
    color:var(--sub);
    font-size:0.75rem;
    margin-top:32px;
    text-shadow:0 1px 6px rgba(0,0,0,.5);
  }

  /* ---------- Leaderboard ---------- */
  .lb{
    margin-top:32px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    backdrop-filter: blur(6px);
  }
  .lb h2{
    font-size:1.1rem;
    margin:0 0 4px;
  }
  .lb .lb-sub{
    color:var(--sub);
    font-size:0.8rem;
    margin:0 0 12px;
  }
  .lb select{
    width:100%;
    font:inherit;
    font-size:0.95rem;
    color:var(--text);
    background:#11151c;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:12px;
  }
  .lb ol{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .lb li{
    display:flex;
    align-items:center;
    gap:12px;
    background:#11151c;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
  }
  .lb .rank{
    flex:0 0 auto;
    width:28px;
    height:28px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:0.85rem;
    background:#2c3240;
    color:var(--text);
  }
  .lb li:nth-child(1) .rank{ background:#ffd166; color:#1a1300; }
  .lb li:nth-child(2) .rank{ background:#d9dee7; color:#10131a; }
  .lb li:nth-child(3) .rank{ background:#e0a070; color:#1f1006; }
  .lb .who{
    flex:1 1 auto;
    min-width:0;
  }
  .lb .who .n{
    font-weight:600;
    font-size:0.95rem;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .lb .who .c{
    color:var(--sub);
    font-size:0.78rem;
  }
  .lb .pts{
    flex:0 0 auto;
    text-align:right;
    font-weight:700;
    font-size:0.95rem;
  }
  .lb .pts small{
    display:block;
    color:var(--sub);
    font-weight:400;
    font-size:0.72rem;
  }
  .lb .lb-msg{
    color:var(--sub);
    font-size:0.9rem;
    text-align:center;
    margin:8px 0 0;
  }
</style>
</head>
<body>

<canvas id="fireworks"></canvas>

<div class="page">
  <header>
    <div class="logo-wrap">
      <canvas id="logoCanvas"></canvas>
    </div>
    <h1>IGCSE ESL Games</h1>
    <p id="subtitle">Select a unit</p>
  </header>

  <div class="grid" id="gameGrid">
    <p id="status" style="color:var(--sub);text-align:center;">Loading games…</p>
  </div>

  <section class="lb" id="lbBox" hidden>
    <h2>Top 5 Leaderboard</h2>
    <p class="lb-sub">Best result per student. Ties are decided by time, then attempts.</p>
    <select id="lbSelect" aria-label="Choose a game"></select>
    <ol id="lbList"></ol>
    <p class="lb-msg" id="lbMsg"></p>
  </section>

  <footer id="footer">Tap a unit to see its games</footer>
</div>

<script>
/* =========================================================
   Fireworks background — twilight sky, animated canvas
   Polished version: additive glow sprites, fading comet trails,
   sky flash on each burst, and varied shell types
   (peony, chrysanthemum, willow, ring, palm, crossette, two-tone)
   with glitter and crackle. Frame-rate independent.
   ========================================================= */
(() => {
  const canvas = document.getElementById('fireworks');
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const COLORS = ['#ff5a5f', '#ffd166', '#06d6a0', '#4f8dfd', '#c77dff', '#ff9f1c', '#f72585', '#ffffff', '#7bdff2', '#b8f35a'];
  const GOLD = '#ffc95e';
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const rand = (a, b) => a + Math.random() * (b - a);

  // Pre-rendered glow sprites (much cheaper and smoother than shadowBlur)
  const sprites = new Map();
  function glow(col) {
    let c = sprites.get(col);
    if (c) return c;
    const r = parseInt(col.slice(1, 3), 16), g = parseInt(col.slice(3, 5), 16), b = parseInt(col.slice(5, 7), 16);
    c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.14, `rgba(${r},${g},${b},1)`);
    gr.addColorStop(0.38, `rgba(${r},${g},${b},0.32)`);
    gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
    sprites.set(col, c);
    return c;
  }

  const scale = () => Math.max(0.6, Math.min(1.4, Math.min(window.innerWidth, window.innerHeight) / 700));

  let particles = [], rockets = [], flashes = [];

  function addP(o) {
    particles.push(Object.assign({
      vx: 0, vy: 0, age: 0, life: 1.5, size: 2, drag: 0.975, grav: 90,
      trail: [], tl: 6, flicker: false, crackle: false, split: false, col: '#ffffff'
    }, o));
  }

  // Speed for a point on a sphere seen from the side: dense bright rim, soft centre
  const sphereSpeed = base => base * Math.sqrt(1 - Math.pow(Math.random() * 2 - 1, 2)) * rand(0.92, 1.05);

  function burst(x, y) {
    const s = scale();
    const base = rand(260, 340) * s;
    const c1 = pick(COLORS);
    let c2 = pick(COLORS); while (c2 === c1) c2 = pick(COLORS);
    const flicker = Math.random() < 0.3, crackle = Math.random() < 0.3;
    const r = Math.random();
    flashes.push({ x, y, col: c1, t: 0, life: 0.5 });

    if (r < 0.22) {                       // peony
      const n = 100 + Math.floor(rand(0, 40));
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + rand(-0.05, 0.05), sp = sphereSpeed(base);
        addP({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, col: c1, life: rand(1.2, 1.8), size: 2.2 * s, tl: 5, flicker, crackle });
      }
    } else if (r < 0.40) {                // chrysanthemum: long glittering trails
      const n = 90 + Math.floor(rand(0, 30));
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + rand(-0.05, 0.05), sp = sphereSpeed(base * 1.05);
        addP({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, col: c1, life: rand(1.6, 2.2), size: 1.8 * s, tl: 14, drag: 0.978, flicker: true, crackle });
      }
    } else if (r < 0.56) {                // willow: slow golden drooping strands
      const n = 80;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2, sp = sphereSpeed(base * 0.85);
        addP({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, col: GOLD, life: rand(2.6, 3.3), size: 1.6 * s, tl: 22, drag: 0.962, grav: 55, flicker: Math.random() < 0.5 });
      }
    } else if (r < 0.68) {                // tilted ring + small core
      const n = 64, rot = rand(0, Math.PI), tilt = rand(0.3, 0.8);
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2, sp = base * 0.9;
        const vx0 = Math.cos(a) * sp, vy0 = Math.sin(a) * sp * tilt;
        addP({ x, y, vx: vx0 * Math.cos(rot) - vy0 * Math.sin(rot), vy: vx0 * Math.sin(rot) + vy0 * Math.cos(rot), col: c1, life: rand(1.3, 1.7), size: 2.2 * s, tl: 6 });
      }
      for (let i = 0; i < 24; i++) {
        const a = rand(0, Math.PI * 2), sp = rand(0.1, 0.35) * base;
        addP({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, col: c2, life: rand(0.9, 1.3), size: 2 * s, tl: 3, flicker: true });
      }
    } else if (r < 0.78) {                // palm: a few thick golden comets
      const n = 7 + Math.floor(rand(0, 3));
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + rand(-0.15, 0.15), sp = base * rand(0.9, 1.05);
        addP({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, col: Math.random() < 0.5 ? GOLD : c1, life: rand(1.6, 2.0), size: 3.4 * s, tl: 24, drag: 0.972, grav: 70, crackle: true });
      }
    } else if (r < 0.88) {                // crossette: stars that split into four
      const n = 22;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2, sp = base * 0.8;
        addP({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, col: c1, life: 1.1, size: 2.4 * s, tl: 8, split: true });
      }
    } else {                              // two-tone: outer shell + inner pistil
      const n = 90;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2, sp = sphereSpeed(base);
        addP({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, col: c1, life: rand(1.3, 1.8), size: 2.1 * s, tl: 6, crackle });
      }
      for (let i = 0; i < 40; i++) {
        const a = (i / 40) * Math.PI * 2, sp = sphereSpeed(base * 0.45);
        addP({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, col: c2, life: rand(1.0, 1.4), size: 2 * s, tl: 4, flicker: true });
      }
    }
  }

  function launch() {
    const vw = window.innerWidth, vh = window.innerHeight, s = scale();
    const x = vw * rand(0.1, 0.9), targetY = vh * rand(0.12, 0.42), g = 380 * s;
    rockets.push({ x, y: vh + 10, vx: rand(-20, 20) * s, vy: -Math.sqrt(2 * g * (vh + 10 - targetY)), g, wob: rand(0, 6) });
  }

  let nextLaunch = 0.4, last = 0;

  function update(dt) {
    const s = scale();
    nextLaunch -= dt;
    if (nextLaunch <= 0) {
      const salvo = Math.random() < 0.12 ? 3 : (Math.random() < 0.25 ? 2 : 1);
      for (let i = 0; i < salvo; i++) setTimeout(launch, i * 180);
      nextLaunch = reduce ? rand(3.5, 5) : rand(0.9, 2.0);
    }

    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.vy += r.g * dt;
      r.x += (r.vx + Math.sin(r.y / 40 + r.wob) * 8 * s) * dt;
      r.y += r.vy * dt;
      addP({ x: r.x, y: r.y, vx: rand(-25, 25) * s, vy: rand(10, 50) * s, col: '#ffc27a', life: rand(0.25, 0.5), size: 1.2 * s, tl: 0, grav: 140 });
      if (r.vy > -45 * s) { burst(r.x, r.y); rockets.splice(i, 1); }
    }

    const born = [];
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      if (p.tl) { p.trail.push(p.x, p.y); if (p.trail.length > p.tl * 2) p.trail.splice(0, 2); }
      const d = Math.pow(p.drag, dt * 60);
      p.vx *= d; p.vy *= d; p.vy += p.grav * s * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.age += dt;
      if (p.split && p.age > p.life * 0.45) {
        const a0 = Math.atan2(p.vy, p.vx) + Math.PI / 4;
        for (let k = 0; k < 4; k++) {
          const a = a0 + k * Math.PI / 2;
          born.push({ x: p.x, y: p.y, vx: Math.cos(a) * 110 * s, vy: Math.sin(a) * 110 * s, col: k % 2 ? '#ffffff' : p.col, life: rand(0.6, 0.9), size: 1.7 * s, tl: 6 });
        }
        particles.splice(i, 1);
        continue;
      }
      if (p.age >= p.life) {
        if (p.crackle) for (let k = 0; k < 4; k++) {
          const a = rand(0, Math.PI * 2), sp = rand(40, 90) * s;
          born.push({ x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, col: '#fff6d6', life: rand(0.12, 0.28), size: 1.3 * s, tl: 0, grav: 40 });
        }
        particles.splice(i, 1);
      }
    }
    born.forEach(addP);

    for (let i = flashes.length - 1; i >= 0; i--) { flashes[i].t += dt; if (flashes[i].t >= flashes[i].life) flashes.splice(i, 1); }
  }

  function draw() {
    const vw = window.innerWidth, vh = window.innerHeight, s = scale();
    ctx.clearRect(0, 0, vw, vh);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // brief light flash across the sky at each burst
    flashes.forEach(f => {
      const k = 1 - f.t / f.life, rad = 260 * s;
      ctx.globalAlpha = 0.2 * k * k;
      ctx.drawImage(glow(f.col), f.x - rad, f.y - rad, rad * 2, rad * 2);
    });

    rockets.forEach(r => {
      const rad = 9 * s;
      ctx.globalAlpha = 1;
      ctx.drawImage(glow('#fff2cc'), r.x - rad, r.y - rad, rad * 2, rad * 2);
    });

    particles.forEach(p => {
      let a = Math.max(0, 1 - p.age / p.life);
      a = Math.pow(a, 1.3) * Math.min(1, p.age / 0.07);
      if (p.flicker && p.age / p.life > 0.35 && Math.random() < 0.5) a *= 0.15;
      if (a <= 0.01) return;
      const t = p.trail;
      if (t.length >= 4) {
        ctx.globalAlpha = a * 0.5;
        ctx.strokeStyle = p.col;
        ctx.lineWidth = p.size * 0.9;
        ctx.beginPath(); ctx.moveTo(t[0], t[1]);
        for (let j = 2; j < t.length; j += 2) ctx.lineTo(t[j], t[j + 1]);
        ctx.lineTo(p.x, p.y); ctx.stroke();
      }
      const rad = p.size * 5 * (0.55 + 0.45 * a);
      ctx.globalAlpha = a;
      ctx.drawImage(glow(p.col), p.x - rad, p.y - rad, rad * 2, rad * 2);
    });

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function loop(ts) {
    const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
    last = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

/* =========================================================
   Small animated "Mr Rich" logo (transparent, looping)
   Scaled-down version of the standalone logo build.
   ========================================================= */
(() => {
  const canvas = document.getElementById('logoCanvas');
  const ctx = canvas.getContext('2d');

  const K = 2;                                   // sprite resolution multiplier
  const LX0 = 70, LY0 = 0, LW = 800, LH = 460;    // logical frame (from source logo)
  const TEXT1 = 'Mr', TEXT2 = 'R1ch';
  const FONT = "'Rockwell Extra Bold','Rockwell','Roboto Slab','Bookman Old Style','Cambria','Georgia','DejaVu Serif',serif";
  const TAU = Math.PI * 2;

  const makeCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

  function starPts(R, r, rot) {
    const p = [];
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + rot + i * Math.PI / 5, rad = i % 2 ? r : R;
      p.push([Math.cos(a) * rad, Math.sin(a) * rad]);
    }
    return p;
  }
  function starPath(g, pts) {
    g.beginPath();
    pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
    g.closePath();
  }
  function tri(g, a, b, c) { g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(c[0], c[1]); g.closePath(); g.fill(); }

  function newSprite(wL, hL, lx, ly) {
    const c = makeCanvas(Math.ceil(wL * K), Math.ceil(hL * K)), g = c.getContext('2d');
    g.scale(K, K);
    return { c, g, wL, hL, lx, ly, t: makeCanvas(c.width, c.height), pivot: [lx + wL / 2, ly + hL / 2] };
  }

  function makeStar(cx, cy, R, rot, cA, cB) {
    const pad = 36, size = 2 * (R + pad);
    const s = newSprite(size, size, cx - size / 2, cy - size / 2);
    const g = s.g; g.translate(size / 2, size / 2);
    const pts = starPts(R, R * .46, rot);
    g.lineJoin = 'round';

    starPath(g, pts);
    g.shadowColor = 'rgba(255,255,255,.95)'; g.shadowBlur = 9 * K;
    g.strokeStyle = '#fff'; g.lineWidth = 12; g.stroke();
    g.shadowBlur = 0; g.stroke();

    const gr = g.createLinearGradient(-R * .6, -R, R * .6, R);
    gr.addColorStop(0, rgb(cA)); gr.addColorStop(1, rgb(cB));
    starPath(g, pts); g.fillStyle = gr; g.fill();

    g.save(); starPath(g, pts); g.clip();
    for (let i = 0; i < 10; i += 2) {
      const tip = pts[i], l = pts[(i + 9) % 10], r = pts[(i + 1) % 10];
      g.fillStyle = 'rgba(255,255,255,.17)'; tri(g, [0, 0], l, tip);
      g.fillStyle = 'rgba(0,0,0,.06)'; tri(g, [0, 0], tip, r);
    }
    g.save(); g.translate(4, 4); starPath(g, pts); g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 14; g.stroke(); g.restore();
    g.save(); g.translate(-4, -4); starPath(g, pts); g.strokeStyle = 'rgba(20,20,60,.22)'; g.lineWidth = 14; g.stroke(); g.restore();
    const gl = g.createRadialGradient(-R * .35, -R * .45, 0, -R * .35, -R * .45, R * 1.1);
    gl.addColorStop(0, 'rgba(255,255,255,.45)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gl; g.fillRect(-R * 1.5, -R * 1.5, R * 3, R * 3);
    g.restore();

    starPath(g, pts); g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 1.6; g.stroke();
    return s;
  }

  function makeText(str, x, baseline, targetW) {
    const m = document.createElement('canvas').getContext('2d');
    let fs = 150; m.font = `900 ${fs}px ${FONT}`;
    fs = Math.min(fs * targetW / m.measureText(str).width, 158);
    m.font = `900 ${fs}px ${FONT}`;
    const tw = m.measureText(str).width;
    const asc = fs * .86, desc = fs * .24, pad = 36;
    const wL = targetW + 2 * pad, hL = asc + desc + 2 * pad;
    const s = newSprite(wL, hL, x - pad, baseline - asc - pad);
    const g = s.g;
    const off = Math.max(0, (targetW - tw) / 2);
    g.font = `900 ${fs}px ${FONT}`; g.textBaseline = 'alphabetic'; g.lineJoin = 'round';
    const tx = pad + off, ty = pad + asc;

    g.strokeStyle = 'rgba(120,180,255,.95)'; g.lineWidth = 16;
    g.shadowColor = 'rgba(100,170,255,1)'; g.shadowBlur = 12 * K;
    g.strokeText(str, tx, ty);
    g.shadowBlur = 0; g.lineWidth = 9; g.strokeStyle = 'rgba(196,224,255,.95)';
    g.strokeText(str, tx, ty);

    const bg = g.createLinearGradient(0, ty - asc * .8, 0, ty);
    bg.addColorStop(0, '#4a86ea'); bg.addColorStop(.5, '#2458c6'); bg.addColorStop(1, '#1a45a5');
    g.fillStyle = bg; g.fillText(str, tx, ty);
    const gg = g.createLinearGradient(0, ty - asc * .8, 0, ty - asc * .2);
    gg.addColorStop(0, 'rgba(255,255,255,.38)'); gg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gg; g.fillText(str, tx, ty);
    g.lineWidth = 1.2; g.strokeStyle = 'rgba(10,30,110,.45)'; g.strokeText(str, tx, ty);
    return s;
  }

  const S = {};
  S.grey = makeStar(280, 178, 160, -.04, [238, 238, 240], [208, 208, 214]);
  S.blue = makeStar(627, 187, 160, 0.0, [162, 172, 232], [204, 212, 248]);
  S.red  = makeStar(452, 291, 146, .03, [255, 182, 182], [232, 116, 122]);
  S.t1   = makeText(TEXT1, 110, 222, 240);
  S.t2   = makeText(TEXT2, 272, 340, 446);

  const els = [
    { s: S.grey, osc: t => ({ r: .05 * Math.sin(t * 1.05), dx: 3 * Math.sin(t * .8 + 1), dy: 5 * Math.sin(t * 1.25 + .4), sc: 1 + .012 * Math.sin(t * 1.6) }) },
    { s: S.blue, osc: t => ({ r: -.045 * Math.sin(t * .95 + 2), dx: -3 * Math.sin(t * .7), dy: 5 * Math.sin(t * 1.15 + 2), sc: 1 + .012 * Math.sin(t * 1.4 + 1) }) },
    { s: S.red,  osc: t => ({ r: .04 * Math.sin(t * 1.2 + 4), dx: 2 * Math.sin(t * .9 + 2), dy: 6 * Math.sin(t * 1.35 + 3), sc: 1 + .014 * Math.sin(t * 1.5 + 2) }) },
    { s: S.t1,   osc: t => ({ r: .012 * Math.sin(t * .9 + 3), dx: 2 * Math.sin(t * 1.1 + 1), dy: 3 * Math.sin(t * 1.5 + 1), sc: 1 }) },
    { s: S.t2,   osc: t => ({ r: .010 * Math.sin(t * .9 + 3.4), dx: 2 * Math.sin(t * 1.0 + 2), dy: 3 * Math.sin(t * 1.5 + 1.6), sc: 1 }) }
  ];

  function band(tg, qc, bw, al) {
    const a = qc - bw / 2, d = bw / 1.16;
    const gr = tg.createLinearGradient(a, 0, a + d, .4 * d);
    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, `rgba(255,255,255,${al})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
    tg.fillStyle = gr; tg.fillRect(0, 0, tg.canvas.width, tg.canvas.height);
  }
  function sheened(s, qc) {
    const q0 = s.lx + .4 * s.ly, q1 = s.lx + s.wL + .4 * (s.ly + s.hL), bw = 170;
    if (qc + bw < q0 || qc - bw > q1) return s.c;
    const tg = s.tg || (s.tg = s.t.getContext('2d'));
    tg.setTransform(1, 0, 0, 1, 0, 0);
    tg.globalCompositeOperation = 'source-over';
    tg.clearRect(0, 0, s.t.width, s.t.height);
    tg.drawImage(s.c, 0, 0);
    tg.globalCompositeOperation = 'source-atop';
    const qpx = (qc - s.lx - .4 * s.ly) * K;
    band(tg, qpx, bw * K, .55);
    band(tg, qpx, 42 * K, .85);
    tg.globalCompositeOperation = 'source-over';
    return s.t;
  }

  const SPOTS = [[278, 18], [627, 24], [452, 146], [783, 138], [186, 307], [364, 432], [540, 428], [140, 110], [700, 236], [330, 214], [520, 340], [246, 88]];
  function glint(g, x, y, sz, a, spin) {
    if (a < .03) return;
    g.save(); g.translate(x, y); g.globalCompositeOperation = 'lighter'; g.globalAlpha = Math.min(1, a);
    const rg = g.createRadialGradient(0, 0, 0, 0, 0, sz * .55);
    rg.addColorStop(0, 'rgba(255,255,255,.95)'); rg.addColorStop(.35, 'rgba(210,235,255,.35)'); rg.addColorStop(1, 'rgba(180,220,255,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(0, 0, sz * .55, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,.95)';
    [[0, 1], [Math.PI / 2, 1], [Math.PI / 4, .5], [-Math.PI / 4, .5]].forEach(([r, k]) => {
      g.save(); g.rotate(r + spin); g.beginPath();
      g.moveTo(0, -sz * k); g.lineTo(sz * .09, 0); g.lineTo(0, sz * k); g.lineTo(-sz * .09, 0); g.closePath(); g.fill(); g.restore();
    });
    g.restore();
  }

  function renderLogo(g, t, k, ox, oy) {
    g.save();
    g.setTransform(k, 0, 0, k, ox - LX0 * k, oy - LY0 * k);

    const qc = -260 + ((t * 220) % 2100);
    const gcx = 470, gcy = 220;
    g.translate(gcx, gcy + 5 * Math.sin(t * 1.3));
    g.rotate(.03 * Math.sin(t * .9));
    g.translate(-gcx, -gcy);

    els.forEach(e => {
      const o = e.osc(t), s = e.s, tex = sheened(s, qc);
      g.save();
      g.shadowColor = 'rgba(30,40,90,.38)'; g.shadowBlur = 16 * k; g.shadowOffsetX = 5 * k; g.shadowOffsetY = 9 * k;
      g.translate(s.pivot[0] + o.dx, s.pivot[1] + o.dy); g.rotate(o.r); g.scale(o.sc, o.sc);
      g.drawImage(tex, -s.wL / 2, -s.hL / 2, s.wL, s.hL);
      g.restore();
    });

    SPOTS.forEach(([x, y], i) => {
      const q = x + .4 * y;
      const sweep = Math.exp(-Math.pow((qc - q) / 60, 2));
      const tw = .5 + .5 * Math.sin(t * 2 + i * 1.7);
      glint(g, x, y, 22 + (i % 4) * 8, sweep + .12 * tw * tw, t * .3 + i);
    });
    g.restore();
  }

  // Fixed internal resolution; CSS scales the element down responsively.
  const CW = 780, CH = 450;
  canvas.width = CW;
  canvas.height = CH;

  function frame(ts) {
    const t = ts / 1000;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, CW, CH);
    const k = Math.min(CW / LW, CH / LH) * .9;
    renderLogo(ctx, t, k, (CW - LW * k) / 2, (CH - LH * k) / 2);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* =========================================================
   Games list (unchanged behaviour, loads folders from GitHub)
   ========================================================= */
(() => {
  const OWNER = "mrrich-ai";
  const REPO  = "Games";
  const EXCLUDE = ["assets", ".github", "images", "img", "css", "js", "scripts"];

  const icons = [
    '<path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>',
    '<circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/>',
    '<path d="M4 19h16"/><path d="M4 15h16"/><rect x="4" y="5" width="16" height="6" rx="1"/>',
    '<path d="M3 12h18"/><path d="M9 6l-6 6 6 6"/><path d="M15 6l6 6-6 6"/>'
  ];

  function prettyName(folder) {
    return folder
      .trim()
      .replace(/^Unit[_\s]?/i, "Unit ")
      .replace(/_/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  // Unit number from the folder name (Unit_3_…, U12_…, Unit _12_…, Unit_12a). None → MISC.
  const unitOf = name => { const m = name.trim().match(/^U(?:nit)?[\s_-]*(\d+)/i); return m ? parseInt(m[1], 10) : null; };
  const plural = n => n + (n === 1 ? ' game' : ' games');

  function card(href, iconIdx, name, sub) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = href;
    a.innerHTML = `
      <div class="icon">
        <svg viewBox="0 0 24 24">${icons[iconIdx % icons.length]}</svg>
      </div>
      <div class="label">
        <div class="name">${name}</div>
        ${sub ? `<div class="sub">${sub}</div>` : ''}
      </div>
      <div class="arrow">›</div>
    `;
    return a;
  }

  let ALL = [];

  function render() {
    const grid = document.getElementById('gameGrid');
    const subtitle = document.getElementById('subtitle');
    const footer = document.getElementById('footer');
    grid.innerHTML = '';

    const hm = location.hash.match(/^#unit-(\d+)$/);
    const isMisc = location.hash === '#misc';
    const chosen = hm ? parseInt(hm[1], 10) : null;

    if (chosen !== null || isMisc) {
      // ---- One unit (or MISC): list its games ----
      const list = ALL.filter(f => isMisc ? f.unit === null : f.unit === chosen);
      subtitle.textContent = isMisc ? 'MISC' : 'Unit ' + chosen;
      footer.textContent = 'Tap a card to open the game';
      const back = document.createElement('a');
      back.className = 'backbtn';
      back.href = '#';
      back.textContent = '\u2190 All units';
      grid.appendChild(back);
      if (!list.length) {
        const p = document.createElement('p');
        p.style.cssText = 'color:var(--sub);text-align:center;';
        p.textContent = 'No games found here yet.';
        grid.appendChild(p);
      }
      list.forEach((f, i) => grid.appendChild(card(encodeURI(f.name + '/index.html'), i, prettyName(f.name), f.name)));
      return;
    }

    // ---- All units, newest (highest number) first; MISC card last ----
    subtitle.textContent = 'Select a unit';
    footer.textContent = 'Tap a unit to see its games';
    const units = {}, misc = [];
    ALL.forEach(f => { if (f.unit === null) misc.push(f); else (units[f.unit] = units[f.unit] || []).push(f); });
    const nums = Object.keys(units).map(Number).sort((a, b) => b - a);
    nums.forEach((u, i) => grid.appendChild(card('#unit-' + u, i, 'Unit ' + u, plural(units[u].length))));
    if (misc.length) grid.appendChild(card('#misc', nums.length, 'MISC', plural(misc.length)));
    if (!nums.length && !misc.length) {
      const p = document.createElement('p');
      p.style.cssText = 'color:var(--sub);text-align:center;';
      p.textContent = 'No games found yet.';
      grid.appendChild(p);
    }
  }

  async function loadGames() {
    const status = document.getElementById('status');
    try {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/`);
      if (!res.ok) throw new Error("GitHub API error " + res.status);
      const items = await res.json();
      ALL = items
        .filter(item => item.type === "dir" && !EXCLUDE.includes(item.name) && !item.name.startsWith("."))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }))
        .map(item => ({ name: item.name, unit: unitOf(item.name) }));
      render();
      window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
    } catch (err) {
      status.textContent = "Couldn't load games list (GitHub API may be rate-limited). Try refreshing in a bit.";
      console.error(err);
    }
  }

  loadGames();
})();

/* =========================================================
   Leaderboard — top 5 per game, read from the Google Sheet
   (needs the leaderboard doGet added to the Apps Script)
   ========================================================= */
(() => {
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbyxAAXBx_SRQcUrw6fYBJ2A78-kJqKTf72suSy3OkKFGVJe9QPtFFX2RkMqCTwUrwOHDA/exec';
  const box = document.getElementById('lbBox');
  const select = document.getElementById('lbSelect');
  const list = document.getElementById('lbList');
  const msg = document.getElementById('lbMsg');
  let data = {};

  // Teacher check: add ?lbdebug=1 to the page URL to see why the leaderboard is not showing.
  function debug(text) {
    console.warn('[leaderboard] ' + text);
    if (/[?&]lbdebug=1/.test(location.search)) {
      box.hidden = false;
      select.hidden = true;
      msg.textContent = text;
    }
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;   // textContent: student-typed names can never inject HTML
    return n;
  }

  function show(game) {
    list.replaceChildren();
    const rows = data[game] || [];
    msg.textContent = rows.length ? '' : 'No scores yet. Be the first!';
    rows.forEach((r, i) => {
      const li = el('li');
      li.appendChild(el('div', 'rank', String(i + 1)));
      const who = el('div', 'who');
      who.appendChild(el('div', 'n', r.name));
      who.appendChild(el('div', 'c', r.cls ? 'Class ' + r.cls : ''));
      li.appendChild(who);
      const pts = el('div', 'pts', r.score);
      pts.appendChild(el('small', '', r.pct + '%'));
      li.appendChild(pts);
      list.appendChild(li);
    });
  }

  fetch(ENDPOINT + '?action=leaderboard&limit=5')
    .then(r => r.json())
    .then(res => {
      if (!res || !res.games) {                     // endpoint not updated yet: keep section hidden
        debug(res && res.error ? 'Endpoint error: ' + res.error : 'Endpoint reply has no leaderboard data. The Apps Script probably needs the leaderboard doGet added and a New version deployed.');
        return;
      }
      data = res.games;
      const names = Object.keys(data).sort((a, b) => a.localeCompare(b));
      box.hidden = false;
      if (!names.length) { msg.textContent = 'No scores yet. Be the first!'; select.hidden = true; return; }
      names.forEach(n => {
        const o = document.createElement('option');
        o.value = n; o.textContent = n;
        select.appendChild(o);
      });
      select.addEventListener('change', () => show(select.value));
      show(names[0]);
    })
    .catch(err => { debug('Could not reach the leaderboard: ' + err); });  // students just see nothing
})();
</script>
