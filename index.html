<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Rich's IGCSE ESL Games</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#1b1f27;
    --card-hover:#242a35;
    --text:#f5f7fa;
    --sub:#a9b1c0;
    --accent:#4f8dfd;
    --accent2:#33d69f;
    --border:#2c3240;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px 16px 48px;
    max-width:520px;
    margin:0 auto;
  }
  header{
    text-align:center;
    margin-bottom:28px;
  }
  header h1{
    font-size:1.6rem;
    margin:0 0 6px;
  }
  header p{
    color:var(--sub);
    margin:0;
    font-size:0.95rem;
  }
  .logo3d{
    font-size:2.2rem;
    font-weight:800;
    font-family:Georgia,'Times New Roman',serif;
    font-style:italic;
    display:inline-block;
    color:var(--accent);
    text-shadow:
      1px 1px 0 #3f74d1,
      2px 2px 0 #2f5aa8,
      3px 3px 0 #234280,
      4px 4px 0 #182f5c,
      5px 5px 8px rgba(0,0,0,0.5);
    margin-bottom:8px;
    letter-spacing:0.5px;
  }
  .grid{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  a.card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    text-decoration:none;
    color:var(--text);
    transition:background 0.15s ease, transform 0.1s ease;
  }
  a.card:active{
    transform:scale(0.98);
  }
  a.card:hover{
    background:var(--card-hover);
    border-color:var(--accent);
  }
  .icon{
    flex:0 0 auto;
    width:42px;
    height:42px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
  }
  .icon svg{
    width:22px;
    height:22px;
    stroke:#0f1115;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .label{
    flex:1 1 auto;
    min-width:0;
  }
  .label .name{
    font-weight:600;
    font-size:1rem;
    line-height:1.25;
  }
  .label .sub{
    color:var(--sub);
    font-size:0.8rem;
    margin-top:2px;
  }
  .arrow{
    flex:0 0 auto;
    color:var(--sub);
    font-size:1.2rem;
  }
  footer{
    text-align:center;
    color:var(--sub);
    font-size:0.75rem;
    margin-top:32px;
  }
</style>
</head>
<body>

<header>
  <div class="logo3d">Mr. Rich's</div>
  <h1>IGCSE ESL Games</h1>
  <p>Pick a unit or activity to play</p>
</header>

<div class="grid" id="gameGrid">
  <p id="status" style="color:var(--sub);text-align:center;">Loading games…</p>
</div>

<footer>Tap a card to open the game</footer>

<script>
  // ---- CONFIG: your GitHub username/org and repo name ----
  const OWNER = "mrrich-ai";
  const REPO  = "Games";
  // Folders to hide from the list even though they're in the repo
  const EXCLUDE = ["assets", ".github", "images", "img", "css", "js", "scripts"];
  // ----------------------------------------------------------

  const icons = [
    '<path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>',
    '<circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/>',
    '<path d="M4 19h16"/><path d="M4 15h16"/><rect x="4" y="5" width="16" height="6" rx="1"/>',
    '<path d="M3 12h18"/><path d="M9 6l-6 6 6 6"/><path d="M15 6l6 6-6 6"/>'
  ];

  function prettyName(folder) {
    return folder
      .trim()
      .replace(/^Unit[_\s]?/i, "Unit ")
      .replace(/_/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  async function loadGames() {
    const grid = document.getElementById('gameGrid');
    const status = document.getElementById('status');

    try {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/`);
      if (!res.ok) throw new Error("GitHub API error " + res.status);
      const items = await res.json();

      const folders = items
        .filter(item => item.type === "dir" && !EXCLUDE.includes(item.name))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }));

      if (folders.length === 0) {
        status.textContent = "No games found yet.";
        return;
      }

      status.remove();

      folders.forEach((folder, i) => {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = encodeURI(folder.name + '/index.html');

        a.innerHTML = `
          <div class="icon">
            <svg viewBox="0 0 24 24">${icons[i % icons.length]}</svg>
          </div>
          <div class="label">
            <div class="name">${prettyName(folder.name)}</div>
            <div class="sub">${folder.name}</div>
          </div>
          <div class="arrow">›</div>
        `;
        grid.appendChild(a);
      });
    } catch (err) {
      status.textContent = "Couldn't load games list (GitHub API may be rate-limited). Try refreshing in a bit.";
      console.error(err);
    }
  }

  loadGames();
</script>

</body>
</html>
