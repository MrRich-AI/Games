<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Crossword</title>
<style>
  :root {
    --navy: #1d3557;
    --red: #e63946;
    --cream: #f1faee;
    --sky: #a8dadc;
    --steel: #457b9d;
    --cell-size: 32px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--cream);
    margin: 0;
    padding: 20px;
    color: var(--navy);
  }
  h1 {
    text-align: center;
    color: var(--red);
    margin-bottom: 4px;
    font-size: 1.8em;
  }
  .subtitle {
    text-align: center;
    color: var(--steel);
    margin-bottom: 20px;
    font-size: 0.95em;
  }
  .wrapper {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    justify-content: center;
    align-items: flex-start;
    max-width: 1200px;
    margin: 0 auto;
  }
  #grid-container {
    overflow-x: auto;
    padding: 8px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(29,53,87,0.15);
  }
  #grid {
    border-collapse: collapse;
  }
  #grid td {
    width: var(--cell-size);
    height: var(--cell-size);
    padding: 0;
    position: relative;
  }
  .cell-block {
    width: 100%;
    height: 100%;
    background: transparent;
  }
  .cell {
    width: 100%;
    height: 100%;
    border: 1px solid var(--navy);
    background: white;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 0;
    color: var(--navy);
    outline: none;
  }
  .cell.correct {
    background: #d4edda;
    color: #1d7a30;
  }
  .cell.incorrect {
    background: #f8d7da;
    color: #a10000;
  }
  .cell.highlight {
    background: var(--sky);
  }
  .cell:focus {
    background: #ffe8a3;
  }
  .cell-number {
    position: absolute;
    top: 1px;
    left: 2px;
    font-size: 9px;
    font-weight: 600;
    color: var(--steel);
    pointer-events: none;
    z-index: 2;
  }
  #clues {
    max-width: 420px;
    min-width: 300px;
  }
  .clue-group h2 {
    color: var(--red);
    border-bottom: 2px solid var(--red);
    padding-bottom: 4px;
    font-size: 1.1em;
    margin-top: 18px;
    margin-bottom: 8px;
  }
  .clue-item {
    padding: 8px 10px;
    margin-bottom: 6px;
    border-radius: 6px;
    background: white;
    cursor: pointer;
    box-shadow: 0 1px 3px rgba(29,53,87,0.1);
    transition: background 0.15s;
    font-size: 0.92em;
    line-height: 1.35;
  }
  .clue-item:hover {
    background: var(--sky);
  }
  .clue-item.active {
    background: #ffe8a3;
    font-weight: 600;
  }
  .clue-num {
    color: var(--red);
    font-weight: 700;
    margin-right: 4px;
  }
  #controls {
    text-align: center;
    margin: 18px 0;
  }
  button {
    background: var(--red);
    color: white;
    border: none;
    padding: 10px 20px;
    margin: 0 6px;
    border-radius: 6px;
    font-size: 0.95em;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover {
    background: #c5303c;
  }
  button.secondary {
    background: var(--steel);
  }
  button.secondary:hover {
    background: #35617f;
  }
  #status {
    text-align: center;
    font-weight: 600;
    margin-top: 10px;
    min-height: 24px;
    color: var(--navy);
  }
  @media (max-width: 700px) {
    :root { --cell-size: 24px; }
    .cell { font-size: 13px; }
  }
</style>
</head>
<body>

<h1>Vocabulary Crossword</h1>
<p class="subtitle">Answers from the vocabulary on p. 168</p>
<p class="subtitle">Each word appears twice: once for its definition, once for a fill-in-the-blank sentence.</p>

<div id="controls">
  <button onclick="checkAnswers()">Check Answers</button>
  <button class="secondary" onclick="revealAll()">Reveal All</button>
  <button class="secondary" onclick="clearAll()">Clear</button>
</div>
<div id="status"></div>

<div class="wrapper">
  <div id="grid-container">
    <table id="grid"></table>
  </div>
  <div id="clues">
    <div class="clue-group">
      <h2>Across</h2>
      <div id="across-clues"></div>
    </div>
    <div class="clue-group">
      <h2>Down</h2>
      <div id="down-clues"></div>
    </div>
  </div>
</div>

<script>
const GRID_DATA = {"width": 18, "height": 17, "cells": {"13,6": "P", "13,7": "A", "13,8": "R", "13,9": "T", "13,10": "I", "13,11": "C", "13,12": "I", "13,13": "P", "13,14": "A", "13,15": "N", "13,16": "T", "13,17": "S", "5,7": "S", "6,7": "P", "7,7": "E", "8,7": "C", "9,7": "I", "10,7": "F", "11,7": "I", "12,7": "C", "14,7": "L", "15,7": "L", "16,7": "Y", "9,9": "D", "10,9": "U", "11,9": "R", "12,9": "A", "14,9": "I", "15,9": "O", "16,9": "N", "5,0": "E", "5,1": "M", "5,2": "B", "5,3": "R", "5,4": "A", "5,5": "C", "5,6": "E", "7,3": "L", "7,4": "E", "7,5": "A", "7,6": "D", "7,8": "R", "7,9": "S", "7,10": "H", "7,11": "I", "7,12": "P", "0,12": "P", "1,12": "A", "2,12": "R", "3,12": "T", "4,12": "I", "5,12": "C", "6,12": "I", "8,12": "A", "9,12": "N", "10,12": "T", "11,12": "S", "3,10": "M", "3,11": "U", "3,13": "U", "3,14": "A", "3,15": "L", "3,0": "S", "4,0": "P", "6,0": "C", "7,0": "I", "8,0": "F", "9,0": "I", "10,0": "C", "11,0": "A", "12,0": "L", "13,0": "L", "14,0": "Y", "3,4": "L", "4,4": "E", "6,4": "D", "8,4": "R", "9,4": "S", "10,4": "H", "11,4": "I", "12,4": "P", "9,16": "D", "10,16": "U", "11,16": "R", "12,16": "A", "14,16": "I", "15,16": "O", "16,16": "N", "1,8": "E", "1,9": "M", "1,10": "B", "1,11": "R", "1,13": "C", "1,14": "E", "1,15": "S", "9,14": "M", "10,14": "U", "11,14": "T", "12,14": "U", "14,14": "L"}};
const ENTRIES = [{"number": 1, "direction": "down", "r": 0, "c": 12, "dr": 1, "dc": 0, "len": 12, "clue": "Definition: people who take part in an activity or event.", "answer": "PARTICIPANTS"}, {"number": 2, "direction": "across", "r": 1, "c": 8, "dr": 0, "dc": 1, "len": 8, "clue": "Fill in the blank: The new school policy ___ diversity and welcomes students from all backgrounds.", "answer": "EMBRACES"}, {"number": 3, "direction": "down", "r": 3, "c": 0, "dr": 1, "dc": 0, "len": 12, "clue": "Definition: in a way that relates to one particular thing; precisely.", "answer": "SPECIFICALLY"}, {"number": 4, "direction": "down", "r": 3, "c": 4, "dr": 1, "dc": 0, "len": 10, "clue": "Definition: the ability to guide, direct, or inspire a group of people.", "answer": "LEADERSHIP"}, {"number": 5, "direction": "across", "r": 3, "c": 10, "dr": 0, "dc": 1, "len": 6, "clue": "Fill in the blank: The two coaches have ___ respect for each other's teams.", "answer": "MUTUAL"}, {"number": 6, "direction": "across", "r": 5, "c": 0, "dr": 0, "dc": 1, "len": 8, "clue": "Definition: accepts or supports something willingly and enthusiastically.", "answer": "EMBRACES"}, {"number": 7, "direction": "down", "r": 5, "c": 7, "dr": 1, "dc": 0, "len": 12, "clue": "Fill in the blank: The teacher asked us to focus ___ on chapter three for the test.", "answer": "SPECIFICALLY"}, {"number": 8, "direction": "across", "r": 7, "c": 3, "dr": 0, "dc": 1, "len": 10, "clue": "Fill in the blank: Strong ___ helped the team finish the project on time.", "answer": "LEADERSHIP"}, {"number": 9, "direction": "down", "r": 9, "c": 9, "dr": 1, "dc": 0, "len": 8, "clue": "Definition: the length of time something lasts or continues.", "answer": "DURATION"}, {"number": 10, "direction": "down", "r": 9, "c": 14, "dr": 1, "dc": 0, "len": 6, "clue": "Definition: shared or felt equally by two or more people.", "answer": "MUTUAL"}, {"number": 11, "direction": "down", "r": 9, "c": 16, "dr": 1, "dc": 0, "len": 8, "clue": "Fill in the blank: The doctor asked about the ___ of her symptoms before making a diagnosis.", "answer": "DURATION"}, {"number": 12, "direction": "across", "r": 13, "c": 6, "dr": 0, "dc": 1, "len": 12, "clue": "Fill in the blank: All ___ received a certificate at the end of the workshop.", "answer": "PARTICIPANTS"}];

const width = GRID_DATA.width;
const height = GRID_DATA.height;
const solutionCells = GRID_DATA.cells; // "r,c" -> letter

// Determine which cells are part of the puzzle (occupied)
const occupied = new Set(Object.keys(solutionCells));

// Build DOM grid
const table = document.getElementById('grid');
const inputRefs = {}; // "r,c" -> input element

for (let r = 0; r < height; r++) {
  const tr = document.createElement('tr');
  for (let c = 0; c < width; c++) {
    const td = document.createElement('td');
    const key = `${r},${c}`;
    if (occupied.has(key)) {
      const block = document.createElement('div');
      block.className = 'cell-block';

      // number label if any entry starts here
      const entry = ENTRIES.find(e => e.r === r && e.c === c);
      if (entry) {
        const numDiv = document.createElement('div');
        numDiv.className = 'cell-number';
        numDiv.textContent = entry.number;
        block.appendChild(numDiv);
      }

      const input = document.createElement('input');
      input.className = 'cell';
      input.maxLength = 1;
      input.dataset.r = r;
      input.dataset.c = c;
      input.autocomplete = 'off';
      input.spellcheck = false;

      input.addEventListener('input', (e) => {
        input.value = input.value.toUpperCase().replace(/[^A-Z]/g, '');
        if (input.value) {
          moveToNext(r, c);
        }
      });
      input.addEventListener('keydown', (e) => handleKeydown(e, r, c));
      input.addEventListener('focus', () => highlightWordAt(r, c));

      block.appendChild(input);
      td.appendChild(block);
      inputRefs[key] = input;
    }
    tr.appendChild(td);
  }
  table.appendChild(tr);
}

// current active direction tracking for arrow navigation & highlight
let currentDir = 'across';

function entriesAt(r, c) {
  return ENTRIES.filter(e => {
    for (let i = 0; i < e.len; i++) {
      const rr = e.r + e.dr * i;
      const cc = e.c + e.dc * i;
      if (rr === r && cc === c) return true;
    }
    return false;
  });
}

function highlightWordAt(r, c) {
  document.querySelectorAll('.cell').forEach(el => el.classList.remove('highlight'));
  document.querySelectorAll('.clue-item').forEach(el => el.classList.remove('active'));

  const matches = entriesAt(r, c);
  if (matches.length === 0) return;

  // prefer currentDir if available, else first match
  let entry = matches.find(e => (e.dr === 0 ? 'across' : 'down') === currentDir) || matches[0];
  currentDir = entry.dr === 0 ? 'across' : 'down';

  for (let i = 0; i < entry.len; i++) {
    const rr = entry.r + entry.dr * i;
    const cc = entry.c + entry.dc * i;
    const el = inputRefs[`${rr},${cc}`];
    if (el) el.classList.add('highlight');
  }

  const clueEl = document.getElementById(`clue-${entry.number}-${currentDir}`);
  if (clueEl) {
    clueEl.classList.add('active');
    clueEl.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  }
}

function moveToNext(r, c) {
  const dr = currentDir === 'down' ? 1 : 0;
  const dc = currentDir === 'across' ? 1 : 0;
  const next = inputRefs[`${r+dr},${c+dc}`];
  if (next) next.focus();
}

function moveToPrev(r, c) {
  const dr = currentDir === 'down' ? -1 : 0;
  const dc = currentDir === 'across' ? -1 : 0;
  const prev = inputRefs[`${r+dr},${c+dc}`];
  if (prev) prev.focus();
}

function handleKeydown(e, r, c) {
  if (e.key === 'ArrowRight') { e.preventDefault(); currentDir='across'; const el = inputRefs[`${r},${c+1}`]; if (el) el.focus(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); currentDir='across'; const el = inputRefs[`${r},${c-1}`]; if (el) el.focus(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); currentDir='down'; const el = inputRefs[`${r+1},${c}`]; if (el) el.focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); currentDir='down'; const el = inputRefs[`${r-1},${c}`]; if (el) el.focus(); }
  else if (e.key === 'Backspace') {
    const el = inputRefs[`${r},${c}`];
    if (!el.value) {
      e.preventDefault();
      moveToPrev(r, c);
      const prevEl = document.activeElement;
      if (prevEl && prevEl.classList.contains('cell')) prevEl.value = '';
    }
  }
}

// Build clue lists
const acrossContainer = document.getElementById('across-clues');
const downContainer = document.getElementById('down-clues');

const sortedEntries = [...ENTRIES].sort((a,b) => a.number - b.number);

sortedEntries.forEach(entry => {
  const dir = entry.dr === 0 ? 'across' : 'down';
  const div = document.createElement('div');
  div.className = 'clue-item';
  div.id = `clue-${entry.number}-${dir}`;
  div.innerHTML = `<span class="clue-num">${entry.number}.</span>${entry.clue}`;
  div.addEventListener('click', () => {
    currentDir = dir;
    const el = inputRefs[`${entry.r},${entry.c}`];
    if (el) el.focus();
  });
  if (dir === 'across') acrossContainer.appendChild(div);
  else downContainer.appendChild(div);
});

function checkAnswers() {
  let total = 0, correct = 0;
  Object.keys(solutionCells).forEach(key => {
    const el = inputRefs[key];
    if (!el) return;
    total++;
    const val = el.value.toUpperCase();
    const answer = solutionCells[key];
    el.classList.remove('correct','incorrect');
    if (val === '') return;
    if (val === answer) { el.classList.add('correct'); correct++; }
    else el.classList.add('incorrect');
  });
  const status = document.getElementById('status');
  if (correct === total) {
    status.textContent = `🎉 All correct! ${correct}/${total} letters.`;
    status.style.color = '#1d7a30';
  } else {
    status.textContent = `${correct}/${total} letters correct so far. Keep going!`;
    status.style.color = '#1d3557';
  }
}

function revealAll() {
  Object.keys(solutionCells).forEach(key => {
    const el = inputRefs[key];
    if (el) {
      el.value = solutionCells[key];
      el.classList.remove('incorrect');
      el.classList.add('correct');
    }
  });
  document.getElementById('status').textContent = 'Answers revealed.';
  document.getElementById('status').style.color = '#1d3557';
}

function clearAll() {
  Object.values(inputRefs).forEach(el => {
    el.value = '';
    el.classList.remove('correct','incorrect','highlight');
  });
  document.getElementById('status').textContent = '';
}
</script>

</body>
</html>
